---
features:
  - |
    The Redfish management interface now supports asynchronous sensor data
    collection.  Operators must opt-in to enabled it via the new
    ``[sensor_data] enable_async_collection`` option (default ``False``),
    the conductor's ``_send_sensor_data`` periodic task attempts to use the
    ``get_sensor_data_async`` method on each node's management interface.
    Drivers that implement this method (currently Redfish only) have their
    sensor data collected concurrently using ``asyncio``, while nodes whose
    drivers do not support it fall back transparently to the existing
    synchronous, thread-based path.
    Collected sensor categories (Fan, Temperature, Power, Drive) and the
    output format are identical to the synchronous path.
    Each collection opens its own session on the node's BMC and releases
    it when it finishes; sessions are not reused between runs of the
    periodic task.
    The number of nodes collected from at any one time is capped by the
    new ``[sensor_data] async_workers`` option (default ``200``), as each
    collection in flight holds a connection to its node's BMC open. It
    can be set far higher than ``[sensor_data] workers``, which bounds
    the synchronous path, because the collections share a single thread
    rather than taking one each.
